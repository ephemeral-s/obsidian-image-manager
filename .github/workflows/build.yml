name: Build plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Validate plugin manifest
        run: node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8')); for (const file of ['main.js','manifest.json']) { if (!fs.existsSync(file)) throw new Error(file + ' is missing'); } if (!manifest.id || !manifest.version) throw new Error('manifest.json is missing id or version');"
